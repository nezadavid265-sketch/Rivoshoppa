<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Registration — Rivoshoppa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="api-config.js"></script>
</head>
<body>
<main class="login-screen">
<div class="login-card" style="max-width:620px">
<div class="logo" style="margin-bottom:24px"><span class="logo__mark"></span> Rivoshoppa seller</div>
<p class="eyebrow">Seller application</p><h1 style="font-size:1.7rem">Create your seller account</h1>
<p class="hero__sub" style="font-size:.95rem">Your application is reviewed by the Rivoshoppa administrator before you can sign in.</p>
<form id="registerForm">
<div class="form-grid">
 <div class="field"><label>Owner name</label><input name="ownerName" required></div>
 <div class="field"><label>Business / shop name</label><input name="businessName" required></div>
 <div class="field"><label>Email</label><input name="email" type="email" required></div>
 <div class="field"><label>Phone</label><input name="phone" required placeholder="+250..."></div>
 <div class="field"><label>Location</label><input name="location" required placeholder="Kigali"></div>
 <div class="field"><label>Main category</label><input name="category" placeholder="Fashion, groceries, electronics..."></div>
 <div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div>
 <div class="field"><label>Confirm password</label><input name="confirm" type="password" minlength="8" required></div>
</div>
<button class="btn btn--primary" id="registerBtn" style="width:100%;margin-top:20px">Submit application</button>
<p class="form-status" id="status" role="status"></p>
</form>
<div style="display:flex;gap:10px;justify-content:center;margin-top:18px"><a class="btn btn--small btn--ghost" href="seller-login.html">Seller login</a><a class="btn btn--small btn--ghost" href="index.html">Home</a></div>
</div></main>
<script>
const API_BASE=window.RivoshoppaApiBase;
const form=document.getElementById('registerForm'),status=document.getElementById('status'),btn=document.getElementById('registerBtn');
async function readJson(response){const text=await response.text();try{return text?JSON.parse(text):{};}catch{throw new Error(`Server returned ${response.status} without a valid response.`);}}
form.addEventListener('submit',async e=>{
 e.preventDefault(); if(form.password.value!==form.confirm.value){status.textContent='Passwords do not match.';status.dataset.state='error';return;}
 btn.disabled=true;btn.textContent='Submitting...';status.textContent='';
 const body=Object.fromEntries(new FormData(form)); delete body.confirm;
 try{const r=await fetch(`${API_BASE}/api/seller/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await readJson(r);if(!r.ok)throw new Error(d.error||'Registration failed.');status.textContent=d.message||'Application submitted.';status.dataset.state='success';form.reset();}
 catch(err){status.textContent=err.message;status.dataset.state='error';}finally{btn.disabled=false;btn.textContent='Submit application';}
});
</script></body></html>
