<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track your delivery — Rivoshoppa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="api-config.js"></script>
</head>
<body>

<header class="nav">
  <div class="nav__inner">
    <a href="index.html" class="logo">
      <span class="logo__mark" aria-hidden="true"></span>
      Rivoshoppa
    </a>
    <nav class="nav__links">
      <a href="index.html">Home</a>
      <a href="cart.html">Book a delivery</a>
      <a href="track.html">Track order</a>
      <a href="support.html">Support</a>
    </nav>
    <a href="cart.html" class="btn btn--small">Book a delivery</a>
  </div>
</header>

<main class="section narrow-section">
  <p class="eyebrow">Track your delivery</p>
  <h1>Where's my order?</h1>
  <p class="hero__sub">Enter the tracking id from your confirmation email or text — it looks like <strong>SS-4183</strong>.</p>

  <form id="trackForm" class="track-form" novalidate>
    <input type="text" id="trackId" name="trackId" placeholder="SS-4183" required autocomplete="off">
    <button type="submit" class="btn btn--primary">Track</button>
  </form>
  <p class="form-status" id="trackStatus" role="status" aria-live="polite"></p>

  <div id="trackResult" class="track-result" hidden>
    <div class="track-result__header">
      <div>
        <p class="eyebrow" style="margin-bottom:4px">Order</p>
        <h2 id="resultId" style="margin:0"></h2>
      </div>
      <span class="status-pill" id="resultStatusPill"></span>
    </div>

    <div id="map" class="delivery-map" style="height: 400px; margin: 24px 0; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.3);"></div>

    <ol class="track-steps" id="trackSteps"></ol>

    <div class="track-details">
      <div>
        <p class="eyebrow" style="margin-bottom:4px">Pickup</p>
        <p id="resultPickup" style="margin:0; color:var(--ink); font-weight:500"></p>
      </div>
      <div>
        <p class="eyebrow" style="margin-bottom:4px">Drop-off</p>
        <p id="resultDropoff" style="margin:0; color:var(--ink); font-weight:500"></p>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer__inner">
    <div class="logo">
      <span class="logo__mark" aria-hidden="true"></span>
      Rivoshoppa
    </div>
    <p>&copy; 2026 Rivoshoppa. Anything, delivered safely.</p>
  </div>
</footer>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDummy&libraries=routes,geocoding"></script>
<script>
const API_BASE = window.RivoshoppaApiBase;
const STEP_LABELS = { requested: "Requested", picked_up: "Picked up", in_transit: "In transit", delivered: "Delivered" };
let map = null;
let directionsService = null;
let directionsRenderer = null;
let geocoder = null;
let currentOrder = null;

// Kigali, Rwanda coordinates and common locations
const KIGALI_CENTER = { lat: -1.9536, lng: 29.8739 };
const LOCATIONS = {
  "Kigali": { lat: -1.9536, lng: 29.8739 },
  "Nyamirambo": { lat: -1.9582, lng: 29.8615 },
  "Kacyiru": { lat: -1.9362, lng: 29.8844 },
  "Remera": { lat: -1.9458, lng: 29.8965 },
  "Kimihurura": { lat: -1.9458, lng: 29.8965 },
  "Gikondo": { lat: -1.9634, lng: 29.8765 }
};

const DEMO_ORDERS = {
  "SS-1001": {
    id: "SS-1001",
    status: "in_transit",
    statusLabel: "In transit",
    steps: ["requested", "picked_up", "in_transit", "delivered"],
    pickup: "Nyamirambo, Kigali, Rwanda",
    dropoff: "Kacyiru, Kigali, Rwanda",
    pickupCoords: LOCATIONS["Nyamirambo"],
    dropoffCoords: LOCATIONS["Kacyiru"],
    items: [{ label: "Package" }],
    driverLocation: { lat: -1.9470, lng: 29.8780 }
  },
  "SS-1002": {
    id: "SS-1002",
    status: "requested",
    statusLabel: "Requested",
    steps: ["requested", "picked_up", "in_transit", "delivered"],
    pickup: "Kimihurura, Kigali, Rwanda",
    dropoff: "Gikondo, Kigali, Rwanda",
    pickupCoords: LOCATIONS["Kimihurura"],
    dropoffCoords: LOCATIONS["Gikondo"],
    items: [{ label: "Food" }],
  },
};

const form = document.getElementById("trackForm");
const status = document.getElementById("trackStatus");
const result = document.getElementById("trackResult");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("trackId").value.trim().toUpperCase();
  status.textContent = "Looking up your order...";
  status.removeAttribute("data-state");
  result.hidden = true;

  try {
    const res = await fetch(`${API_BASE}/api/orders/${encodeURIComponent(id)}/track`);
    const text = await res.text();
    let data = null;

    if (text) {
      try {
        data = JSON.parse(text);
      } catch {
        data = null;
      }
    }

    if (!res.ok) {
      if (DEMO_ORDERS[id]) {
        renderResult(DEMO_ORDERS[id]);
        status.textContent = "Showing a demo order while the backend is unavailable.";
        return;
      }
      throw new Error(data?.error || "Order not found.");
    }

    if (!data) {
      throw new Error("The tracking service returned an empty response.");
    }

    renderResult(data);
    status.textContent = "";
  } catch (err) {
    status.textContent = err.message;
    status.setAttribute("data-state", "error");
  }
});

function renderResult(order) {
  currentOrder = order;
  document.getElementById("resultId").textContent = order.id;

  const pill = document.getElementById("resultStatusPill");
  pill.textContent = order.statusLabel;
  pill.className = "status-pill status-pill--" + order.status;

  document.getElementById("resultPickup").textContent = order.pickup;
  document.getElementById("resultDropoff").textContent = order.dropoff;

  const stepsEl = document.getElementById("trackSteps");
  stepsEl.innerHTML = "";
  const currentIndex = order.steps.indexOf(order.status);

  order.steps.forEach((step, i) => {
    const li = document.createElement("li");
    li.className = "track-step" + (i <= currentIndex ? " track-step--done" : "");
    li.innerHTML = `<span class="track-step__dot"></span><span>${STEP_LABELS[step]}</span>`;
    stepsEl.appendChild(li);
  });

  // Add directions button
  const resultHeader = document.querySelector(".track-result__header");
  let directionsBtn = document.getElementById("directionsBtn");
  if (!directionsBtn) {
    directionsBtn = document.createElement("button");
    directionsBtn.id = "directionsBtn";
    directionsBtn.className = "btn btn--small btn--primary";
    directionsBtn.style.marginTop = "12px";
    directionsBtn.textContent = "📍 Get Directions";
    directionsBtn.onclick = openGoogleMapsNavigation;
    resultHeader.appendChild(directionsBtn);
  }

  const trackResult = document.getElementById("trackResult");
  trackResult.hidden = false;

  if (window.google && window.google.maps) {
    initMap();
    displayRoute(order);
  }
}

function initMap() {
  if (map) return;
  map = new google.maps.Map(document.getElementById("map"), {
    zoom: 13,
    center: KIGALI_CENTER,
    styles: [
      {
        elementType: "geometry",
        stylers: [{ color: "#1a2341" }]
      },
      {
        featureType: "water",
        elementType: "geometry.fill",
        stylers: [{ color: "#17263c" }]
      },
      {
        featureType: "road",
        elementType: "geometry.fill",
        stylers: [{ color: "#38414e" }]
      },
      {
        featureType: "road.arterial",
        elementType: "geometry.fill",
        stylers: [{ color: "#4d5a6e" }]
      },
      {
        featureType: "poi",
        elementType: "labels.text.fill",
        stylers: [{ color: "#9eb7ff" }]
      }
    ]
  });
  directionsService = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer({
    map: map,
    polylineOptions: {
      strokeColor: "#7da2ff",
      strokeWeight: 4,
      strokeOpacity: 0.8
    },
    suppressMarkers: false
  });
  geocoder = new google.maps.Geocoder();
}

function displayRoute(order) {
  if (!directionsService || !directionsRenderer) return;

  const pickupCoords = order.pickupCoords;
  const dropoffCoords = order.dropoffCoords;

  if (pickupCoords && dropoffCoords) {
    // Use coordinates directly
    const request = {
      origin: pickupCoords,
      destination: dropoffCoords,
      travelMode: "DRIVING",
      unitSystem: google.maps.UnitSystem.METRIC
    };

    directionsService.route(request, (result, status) => {
      if (status === "OK") {
        directionsRenderer.setDirections(result);
        
        // Add custom markers for pickup and dropoff
        addCustomMarkers(order, result);
      } else {
        console.warn("Directions request failed due to " + status);
        addCustomMarkers(order);
      }
    });
  } else {
    // Fallback to geocoding addresses
    const request = {
      origin: order.pickup,
      destination: order.dropoff,
      travelMode: "DRIVING",
      unitSystem: google.maps.UnitSystem.METRIC
    };

    directionsService.route(request, (result, status) => {
      if (status === "OK") {
        directionsRenderer.setDirections(result);
        addCustomMarkers(order, result);
      } else {
        console.warn("Directions request failed: " + status);
        addCustomMarkers(order);
      }
    });
  }
}

function addCustomMarkers(order, directionsResult) {
  const pickupLocation = order.pickupCoords || KIGALI_CENTER;
  const dropoffLocation = order.dropoffCoords || KIGALI_CENTER;

  // Pickup marker
  new google.maps.Marker({
    position: pickupLocation,
    map: map,
    title: "Pickup: " + order.pickup,
    icon: "http://maps.google.com/mapfiles/ms/icons/green-dot.png",
    zIndex: 10
  });

  // Dropoff marker
  new google.maps.Marker({
    position: dropoffLocation,
    map: map,
    title: "Dropoff: " + order.dropoff,
    icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png",
    zIndex: 10
  });

  // If in transit, show driver location
  if (order.status === "in_transit" && order.driverLocation) {
    new google.maps.Marker({
      position: order.driverLocation,
      map: map,
      title: "🚗 Driver",
      icon: "http://maps.google.com/mapfiles/ms/icons/yellow-dot.png",
      zIndex: 20
    });
  }
}

function openGoogleMapsNavigation() {
  if (!currentOrder) return;

  const pickup = currentOrder.pickup;
  const dropoff = currentOrder.dropoff;

  // URL format for Google Maps directions
  const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(pickup)}&destination=${encodeURIComponent(dropoff)}&travelmode=driving`;

  window.open(mapsUrl, "_blank");
}
</script>
</body>
</html>
